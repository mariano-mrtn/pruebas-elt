name: probe-rate-limits

# Solo manual: se dispara desde la pestaña Actions -> Run workflow
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_rate_limits.py
