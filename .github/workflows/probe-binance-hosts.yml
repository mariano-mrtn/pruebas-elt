name: probe-binance-hosts

# Solo manual: pestaña Actions -> probe-binance-hosts -> Run workflow
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_binance_hosts.py
